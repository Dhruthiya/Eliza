<!DOCTYPE html>
<html>
<head>
    <title>ELIZA - Chatbot</title>
    <style>
        :root {
            --bg-top: #07100f;
            --bg-bottom: #020403;
            --panel: rgba(4, 12, 9, 0.84);
            --line: rgba(97, 255, 176, 0.22);
            --line-strong: rgba(97, 255, 176, 0.38);
            --text: #d9fff0;
            --muted: #8fe8bc;
            --accent: #66ffc2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Courier New', monospace;
            background:
                radial-gradient(circle at top, rgba(0, 255, 170, 0.10), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .header {
            backdrop-filter: blur(10px);
            background: rgba(2, 10, 7, 0.7);
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            letter-spacing: 0.14em;
            padding: 20px 28px 18px;
            text-align: left;
            text-transform: uppercase;
        }

        .chat-box {
            flex: 1;
            font-size: clamp(18px, 1.7vw, 24px);
            line-height: 1.75;
            margin: 0 auto;
            max-width: 1080px;
            overflow-y: auto;
            padding: 28px 28px 20px;
            width: 100%;
        }

        .message {
            margin-bottom: 18px;
            word-break: break-word;
        }

        .user { color: var(--text); }
        .eliza { color: var(--accent); }

        .input-area {
            backdrop-filter: blur(14px);
            background: var(--panel);
            border-top: 1px solid var(--line);
            display: flex;
            gap: 14px;
            padding: 18px 24px 24px;
        }

        input {
            flex: 1;
            min-width: 0;
            background: rgba(6, 18, 13, 0.92);
            border: 1px solid var(--line-strong);
            color: var(--text);
            padding: 16px 18px;
            font-family: 'Courier New', monospace;
            font-size: 18px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
        }

        button {
            background: rgba(6, 18, 13, 0.92);
            border: 1px solid var(--line-strong);
            color: var(--text);
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            min-width: 120px;
            padding: 16px 18px;
            text-transform: uppercase;
        }

        button:hover {
            background: rgba(12, 29, 22, 0.96);
        }

        @media (max-width: 720px) {
            .header {
                padding: 16px 18px 14px;
            }

            .chat-box {
                font-size: 17px;
                padding: 20px 18px 16px;
            }

            .input-area {
                gap: 10px;
                padding: 14px 16px 16px;
            }

            button {
                min-width: 92px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">ELIZA / Rust</div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autofocus>
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `<span class="${sender}">${sender === 'user' ? 'YOU' : 'ELIZA'}: ${text}</span>`;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('http://localhost:4000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                addMessage(data.response, 'eliza');
            } catch (error) {
                addMessage('Connection error. Is the server running?', 'eliza');
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial greeting
        window.onload = () => {
            addMessage('How do you do. Please tell me your problem.', 'eliza');
        };
    </script>
</body>
</html>
