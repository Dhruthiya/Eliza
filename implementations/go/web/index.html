<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELIZA - Go</title>
    <style>
        :root {
            --bg-top: #08110f;
            --bg-bottom: #020403;
            --panel: rgba(4, 12, 9, 0.84);
            --line: rgba(97, 255, 176, 0.22);
            --line-strong: rgba(97, 255, 176, 0.38);
            --text: #d9fff0;
            --muted: #8fe8bc;
            --accent: #66ffc2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(0, 255, 170, 0.10), transparent 28%),
                linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
            color: var(--text);
            font-family: "Courier New", monospace;
        }

        .shell {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
        }

        .topbar {
            backdrop-filter: blur(10px);
            background: rgba(2, 10, 7, 0.7);
            border-bottom: 1px solid var(--line);
            color: var(--muted);
            letter-spacing: 0.14em;
            padding: 20px 28px 18px;
            text-transform: uppercase;
        }

        .chat {
            flex: 1;
            font-size: clamp(18px, 1.7vw, 24px);
            line-height: 1.75;
            margin: 0 auto;
            max-width: 1080px;
            overflow-y: auto;
            padding: 28px 28px 20px;
            width: 100%;
        }

        .message {
            margin-bottom: 18px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .user { color: var(--text); }
        .eliza { color: var(--accent); }

        .controls {
            backdrop-filter: blur(14px);
            background: var(--panel);
            border-top: 1px solid var(--line);
            display: flex;
            gap: 14px;
            padding: 18px 24px 24px;
        }

        input, button {
            background: rgba(6, 18, 13, 0.92);
            border: 1px solid var(--line-strong);
            color: var(--text);
            font: inherit;
            padding: 16px 18px;
        }

        input {
            flex: 1;
            font-size: 18px;
            min-width: 0;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
        }

        button {
            cursor: pointer;
            font-size: 16px;
            min-width: 120px;
            text-transform: uppercase;
        }

        button:hover {
            background: rgba(12, 29, 22, 0.96);
        }

        @media (max-width: 720px) {
            .topbar {
                padding: 16px 18px 14px;
            }

            .chat {
                font-size: 17px;
                padding: 20px 18px 16px;
            }

            .controls {
                gap: 10px;
                padding: 14px 16px 16px;
            }

            button {
                min-width: 92px;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="topbar">ELIZA / Go</div>
        <section class="chat" id="chatBox"></section>
        <form class="controls" id="chatForm">
            <input id="userInput" type="text" autocomplete="off" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </main>
    <script>
        const chatBox = document.getElementById("chatBox");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");

        function addMessage(sender, text) {
            const element = document.createElement("div");
            element.className = `message ${sender}`;
            element.textContent = `${sender === "user" ? "YOU" : "ELIZA"}: ${text}`;
            chatBox.appendChild(element);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(text) {
            addMessage("user", text);
            userInput.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                addMessage("eliza", data.response);
            } catch (error) {
                addMessage("eliza", "Connection error. Is the server running?");
            }
        }

        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            sendMessage(text);
        });

        addMessage("eliza", "How do you do. Please tell me your problem.");
    </script>
</body>
</html>
