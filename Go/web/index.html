<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELIZA - Go</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            align-items: center;
            background:
                radial-gradient(circle at top, rgba(0, 255, 170, 0.08), transparent 35%),
                linear-gradient(180deg, #08110f 0%, #030504 100%);
            color: #9dffcf;
            display: flex;
            font-family: "Courier New", monospace;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .shell {
            background: rgba(1, 8, 6, 0.94);
            border: 1px solid rgba(97, 255, 176, 0.45);
            border-radius: 14px;
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            display: flex;
            flex-direction: column;
            height: min(760px, 92vh);
            max-width: 760px;
            overflow: hidden;
            width: 100%;
        }
        .topbar {
            background: linear-gradient(90deg, rgba(13, 36, 28, 0.95), rgba(5, 16, 12, 0.95));
            border-bottom: 1px solid rgba(97, 255, 176, 0.25);
            letter-spacing: 0.08em;
            padding: 16px 20px;
            text-transform: uppercase;
        }
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
        }
        .message {
            line-height: 1.5;
            margin-bottom: 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .user { color: #d9fff0; }
        .eliza { color: #66ffc2; }
        .controls {
            border-top: 1px solid rgba(97, 255, 176, 0.25);
            display: flex;
            gap: 12px;
            padding: 16px;
        }
        input, button {
            background: #07100d;
            border: 1px solid rgba(97, 255, 176, 0.35);
            border-radius: 10px;
            color: #c9ffe6;
            font: inherit;
            padding: 12px 14px;
        }
        input {
            flex: 1;
        }
        button {
            cursor: pointer;
            min-width: 96px;
        }
        button:hover {
            background: #0d1b16;
        }
    </style>
</head>
<body>
    <main class="shell">
        <div class="topbar">ELIZA / Go</div>
        <section class="chat" id="chatBox"></section>
        <form class="controls" id="chatForm">
            <input id="userInput" type="text" autocomplete="off" placeholder="Type your message...">
            <button type="submit">Send</button>
        </form>
    </main>
    <script>
        const chatBox = document.getElementById("chatBox");
        const chatForm = document.getElementById("chatForm");
        const userInput = document.getElementById("userInput");

        function addMessage(sender, text) {
            const element = document.createElement("div");
            element.className = `message ${sender}`;
            element.textContent = `${sender === "user" ? "YOU" : "ELIZA"}: ${text}`;
            chatBox.appendChild(element);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage(text) {
            addMessage("user", text);
            userInput.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                addMessage("eliza", data.response);
            } catch (error) {
                addMessage("eliza", "Connection error. Is the server running?");
            }
        }

        chatForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const text = userInput.value.trim();
            if (!text) return;
            sendMessage(text);
        });

        addMessage("eliza", "How do you do. Please tell me your problem.");
    </script>
</body>
</html>
