<!DOCTYPE html>
<html>
<head>
    <title>ELIZA - Chatbot</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Courier New', monospace; 
            background: #1a1a1a; 
            color: #0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 600px;
            height: 700px;
            background: #000;
            border: 2px solid #0f0;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }
        .header {
            padding: 15px;
            background: #0a0a0a;
            border-bottom: 1px solid #0f0;
            text-align: center;
            font-size: 20px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            font-size: 14px;
            line-height: 1.6;
        }
        .message {
            margin-bottom: 15px;
        }
        .user { color: #00ff00; }
        .eliza { color: #00ffff; }
        .input-area {
            padding: 15px;
            border-top: 1px solid #0f0;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            background: #0a0a0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #0ff; }
        button {
            background: #0a0a0a;
            border: 1px solid #0f0;
            color: #0f0;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        button:hover { background: #0f0; color: #000; }
        .chat-box::-webkit-scrollbar { width: 8px; }
        .chat-box::-webkit-scrollbar-track { background: #0a0a0a; }
        .chat-box::-webkit-scrollbar-thumb { background: #0f0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">╔═══ ELIZA ═══╗</div>
        <div class="chat-box" id="chatBox"></div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Type your message..." autofocus>
            <button onclick="sendMessage()">SEND</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message';
            msg.innerHTML = `<span class="${sender}">${sender === 'user' ? 'YOU' : 'ELIZA'}: ${text}</span>`;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';

            try {
                const response = await fetch('http://localhost:4000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                addMessage(data.response, 'eliza');
            } catch (error) {
                addMessage('Connection error. Is the server running?', 'eliza');
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Initial greeting
        window.onload = () => {
            addMessage('How do you do. Please tell me your problem.', 'eliza');
        };
    </script>
</body>
</html>
